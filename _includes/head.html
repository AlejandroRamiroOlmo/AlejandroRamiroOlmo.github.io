<!-- ========================================== -->
<!-- CSS PERSONALIZADO (BARRA DE NAVEGACIÓN)    -->
<!-- ========================================== -->
<style>
  /* 1. Fondo de la barra principal */
  .masthead {
    background-color: #011121 !important; /* Azul muy oscuro casi negro */
    border-bottom: 2px solid #0f4c75 !important; /* Línea separadora azul marino */
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3) !important;
  }

  /* 2. Título de la web (Tu Nombre / Inicio) */
  .masthead .site-title {
    color: #ffffff !important;
    font-weight: 700 !important;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s ease;
  }
  .masthead .site-title:hover {
    color: #00ffcc !important;
    text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
  }

  /* 3. Enlaces del menú (Proyectos, CV, Sobre Mí...) */
  .masthead .site-nav ul li a {
    color: #bbe1fa !important;
    font-weight: 600 !important;
    transition: all 0.3s ease !important;
  }
  .masthead .site-nav ul li a:hover {
    color: #00ffcc !important;
    text-shadow: 0 0 10px rgba(0, 255, 204, 0.4) !important;
  }

  /* 4. Botón del menú en vista Móvil (El icono de las 3 rayitas) */
  .greedy-nav button.nav-selector,
  .greedy-nav button.toggle {
    color: #00ffcc !important;
  }

  /* 5. Menú desplegable en Móvil */
  .greedy-nav .hidden-links {
    background-color: #021a30 !important;
    border: 1px solid #0f4c75 !important;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5) !important;
  }
  .greedy-nav .hidden-links a {
    color: #bbe1fa !important;
  }
  .greedy-nav .hidden-links a:hover {
    background-color: #0f4c75 !important; /* Fondo al pasar el ratón en móvil */
    color: #00ffcc !important;
  }
</style>
